<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 160" width="100%" preserveAspectRatio="xMidYMid meet">
<style>
  .icon-l { animation: glowPulseL 2.5s ease-in-out infinite; }
  @keyframes glowPulseL {
    0%,100% { filter: drop-shadow(0 0 6px rgba(29,78,216,0.35)); }
    50%      { filter: drop-shadow(0 0 18px rgba(29,78,216,0.70)) drop-shadow(0 0 32px rgba(99,38,186,0.30)); }
  }
  .sp1l { animation: sparkL 2s ease-in-out infinite; }
  .sp2l { animation: sparkL 2s ease-in-out infinite 0.55s; }
  @keyframes sparkL {
    0%,100% { opacity:0.20; }
    50%      { opacity:0.85; }
  }
  .eg-text-l { animation: egPulseL 3s ease-in-out infinite; }
  @keyframes egPulseL {
    0%,100% { fill:#1d4ed8; }
    50%      { fill:#2563eb; }
  }
</style>
<defs>
  <clipPath id="lclip">
    <polygon points="90,5 170,80 90,155 10,80"/>
  </clipPath>
  <linearGradient id="lShimmer" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="700" y2="0">
    <stop offset="0%"  stop-color="#1e293b"/>
    <stop offset="42%" stop-color="#1e293b"/>
    <stop offset="50%" stop-color="#3b82f6"/>
    <stop offset="58%" stop-color="#1e293b"/>
    <stop offset="100%" stop-color="#1e293b"/>
    <animateTransform attributeName="gradientTransform" type="translate"
      values="-660,0;660,0;-660,0" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
</defs>

<!-- CRYSTAL ICON — centered at x=90 -->
<g class="icon-l">
  <ellipse cx="90" cy="80" rx="68" ry="68" fill="#2563eb" opacity="0.07">
    <animate attributeName="rx" values="58;76;58" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="58;76;58" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <polygon points="90,5  45,35  90,80"   fill="#93c5fd" opacity="0.95"/>
  <polygon points="90,5  135,35 90,80"   fill="#60a5fa" opacity="0.90"/>
  <polygon points="135,35 170,80 90,80"  fill="#3b82f6" opacity="0.92"/>
  <polygon points="170,80 135,125 90,80" fill="#2563eb" opacity="0.90"/>
  <polygon points="135,125 90,155 90,80" fill="#1d4ed8" opacity="0.92"/>
  <polygon points="90,155 45,125 90,80"  fill="#1e40af" opacity="0.94"/>
  <polygon points="45,125 10,80  90,80"  fill="#1d4ed8" opacity="0.90"/>
  <polygon points="10,80  45,35  90,80"  fill="#2563eb" opacity="0.88"/>
  <polygon points="90,5 80,30 100,30" fill="white" opacity="0.55"/>
  <polygon points="90,5 135,35 170,80 135,125 90,155 45,125 10,80 45,35"
           fill="none" stroke="#1d4ed8" stroke-width="0.8" opacity="0.35"/>
  <path d="M52,115 L52,45 L128,115 L128,45"
        clip-path="url(#lclip)"
        fill="none" stroke="white" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.96"/>
  <circle cx="90" cy="80" r="3.5" fill="white" opacity="0.98"/>
  <circle cx="90" cy="80" r="5" fill="white" opacity="0.14">
    <animate attributeName="r"       values="4;13;4"        dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.14;0.04;0.14" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="90" y1="0"  x2="90" y2="4"   stroke="white"   stroke-width="2"   class="sp1l"/>
  <line x1="176" y1="80" x2="183" y2="80" stroke="#3b82f6" stroke-width="1.5" class="sp2l"/>
  <line x1="90" y1="156" x2="90" y2="163" stroke="#1d4ed8" stroke-width="1.5" class="sp1l"/>
  <line x1="1"  y1="80"  x2="8"  y2="80"  stroke="#1d4ed8" stroke-width="1.5" class="sp2l"/>
</g>

<!-- TEXT — starts at x=196 -->
<text x="196" y="103"
      font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
      font-weight="800" font-size="70" letter-spacing="-1">
  <tspan fill="url(#lShimmer)">Novatrix</tspan><tspan class="eg-text-l" fill="#1d4ed8">EG</tspan>
</text>

<!-- Separator line -->
<line x1="196" y1="112" x2="655" y2="112" stroke="#cbd5e1" stroke-width="0.8"/>

<!-- URL -->
<text x="197" y="134"
      font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
      font-weight="400" font-size="18" letter-spacing="0.5" fill="#64748b">
  www.novatrixeg.com
</text>

</svg>