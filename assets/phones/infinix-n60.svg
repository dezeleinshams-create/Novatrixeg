<svg xmlns="http://www.w3.org/2000/svg" width="100" height="140" viewBox="0 0 100 140">
  <defs>
    <linearGradient id="bginfinix-n60" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00875A;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00d47a;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="bodyinfinix-n60" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="screeninfinix-n60" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00875A;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00d47a;stop-opacity:0.15"/>
    </linearGradient>
  </defs>
  <!-- Phone body -->
  <rect x="15" y="5" width="70" height="130" rx="12" ry="12" fill="url(#bodyinfinix-n60)" stroke="#00875A" stroke-width="1.5" opacity="0.9"/>
  <!-- Screen -->
  <rect x="20" y="18" width="60" height="96" rx="6" ry="6" fill="url(#screeninfinix-n60)"/>
  <!-- Camera dot -->
  <circle cx="50" cy="12" r="2.5" fill="#00875A" opacity="0.6"/>
  <!-- Brand text -->
  <text x="50" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#00875A" opacity="0.9">Infinix</text>
  <!-- Model text -->
  <text x="50" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="#94a3b8">Note 60</text>
  <!-- Screen shine -->
  <rect x="22" y="20" width="20" height="3" rx="2" fill="white" opacity="0.06"/>
  <!-- Home indicator -->
  <rect x="38" y="120" width="24" height="2.5" rx="1.5" fill="#00875A" opacity="0.4"/>
  <!-- Side button -->
  <rect x="85" y="40" width="3" height="18" rx="1.5" fill="#00875A" opacity="0.3"/>
</svg>