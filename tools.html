    <script>
        // Theme toggle
        document.addEventListener("DOMContentLoaded", () => {
            const themeToggleBtn = document.getElementById("themeToggleBtn");
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener("click", () => {
                    document.body.classList.toggle("light-theme");
                    const isLight = document.body.classList.contains("light-theme");
                    themeToggleBtn.querySelector("i").className = isLight ? "fas fa-moon" : "fas fa-sun";
                });
            }
        });

        // Initialize Tools Engine — runs immediately since scripts are sync + DOM is ready (end of body)
        function startEngine() {
            if (typeof ToolsEngine !== "undefined" && typeof NOVATRIX_TOOLS !== "undefined") {
                ToolsEngine.init(NOVATRIX_TOOLS);
                console.log("[Novatrix] Tools engine loaded:", NOVATRIX_TOOLS.length, "tools");
            } else {
                console.error("[Novatrix] ToolsEngine or NOVATRIX_TOOLS not found!");
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", startEngine);
        } else {
            startEngine();
        }
    </script>
