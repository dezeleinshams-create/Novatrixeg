<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر القوالب البصري المباشر — عدّل القالب أونلاين مجاناً | Novatrix EG</title>
    <meta name="description" content="محرر قوالب مواقع بصري مجاني — عدّل النصوص والألوان والخطوط مباشرة في المتصفح وحمّل موقعك كـ ZIP جاهز للنشر.">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "محرر القوالب البصري — Novatrix EG",
      "url": "https://dezeleinshams-create.github.io/NEXURAEG/template-editor.html",
      "applicationCategory": "DesignApplication",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EGP" }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        a { text-decoration: none; color: inherit; }

        /* ========== TOP BAR ========== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 52px;
            min-height: 52px;
            background: #0f1629;
            border-bottom: 1px solid #1e293b;
            z-index: 100;
        }
        .top-bar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .top-bar-logo img { height: 28px; }
        .top-bar-nav { display: flex; gap: 4px; }
        .top-bar-nav a {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #94a3b8;
            transition: 0.2s;
        }
        .top-bar-nav a:hover { color: #e2e8f0; background: rgba(255,255,255,0.05); }
        .top-bar-nav a.active { color: #3b82f6; background: rgba(59,130,246,0.1); }
        .top-bar-title {
            font-size: 0.85rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
        }
        .top-bar-title i { color: #3b82f6; }

        /* ========== MAIN LAYOUT ========== */
        .editor-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: #0f1629;
            border-left: 1px solid #1e293b;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sb-section {
            padding: 14px 16px;
            border-bottom: 1px solid #1e293b;
        }
        .sb-section h4 {
            font-size: 0.78rem;
            font-weight: 800;
            color: #64748b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sb-select {
            width: 100%;
            padding: 8px 10px;
            background: #1a2035;
            border: 1px solid #2d3a54;
            border-radius: 8px;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .page-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
        .page-tab {
            padding: 5px 10px;
            background: #1a2035;
            border: 1px solid #2d3a54;
            border-radius: 6px;
            color: #94a3b8;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .page-tab:hover { border-color: #3b82f6; color: #3b82f6; }
        .page-tab.active { background: #3b82f6; color: white; border-color: #3b82f6; }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .color-row label { font-size: 0.78rem; font-weight: 700; }
        .color-row input[type="color"] {
            width: 36px; height: 28px;
            border: 2px solid #2d3a54;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .sb-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            transition: 0.2s;
            font-family: inherit;
        }
        .sb-btn:hover { transform: translateY(-1px); }
        .sb-btn.edit-btn { background: #1a2035; color: #e2e8f0; border: 1px solid #2d3a54; }
        .sb-btn.edit-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .sb-btn.download { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .sb-btn.reset { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }

        /* ========== TOOLBAR ========== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: #111827;
            border-bottom: 1px solid #1e293b;
            gap: 8px;
        }
        .device-btns { display: flex; gap: 4px; }
        .device-btn {
            padding: 5px 10px;
            background: #1a2035;
            border: 1px solid #2d3a54;
            border-radius: 6px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .device-btn:hover { color: #3b82f6; border-color: #3b82f6; }
        .device-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }

        /* ========== PREVIEW ========== */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        .preview-container {
            flex: 1;
            background: #1a1a2e;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 12px;
            overflow: auto;
        }
        .preview-frame {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            width: 100%;
            transition: width 0.3s;
            display: flex;
            flex-direction: column;
        }
        .preview-frame.tablet-mode { width: 768px; }
        .preview-frame.mobile-mode { width: 375px; }
        .preview-frame iframe {
            flex: 1;
            width: 100%;
            border: none;
            display: block;
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
        .empty-state i { font-size: 3rem; color: #3b82f6; margin-bottom: 16px; }
        .empty-state h2 { font-size: 1.3rem; font-weight: 900; margin-bottom: 8px; }
        .empty-state p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }

        /* ========== TOAST ========== */
        .editor-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.82rem;
            z-index: 99999;
            transition: 0.4s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(16,185,129,0.4);
        }
        .editor-toast.show { transform: translateX(-50%) translateY(0); }

        /* ========== EDIT INDICATOR ========== */
        .edit-indicator {
            position: fixed;
            top: 58px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(59,130,246,0.9);
            color: white;
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 0.72rem;
            font-weight: 700;
            z-index: 999;
            display: none;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(8px);
        }
        .edit-indicator.show { display: flex; }

        /* ========== MOBILE ========== */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 58px; right: 8px;
            z-index: 101;
            background: #3b82f6;
            color: white;
            border: none;
            width: 30px; height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                top: 52px; right: 0; bottom: 0;
                z-index: 100;
                transform: translateX(0);
                transition: 0.3s;
            }
            .sidebar.hidden { transform: translateX(100%); }
            .sidebar-toggle { display: flex; }
        }
        @media (max-width: 600px) {
            .top-bar-nav a { font-size: 0.7rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div style="display:flex;align-items:center;gap:16px">
            <div class="top-bar-logo" onclick="location.href='index.html'">
                <img src="assets/logo-light.svg" alt="Novatrix EG">
            </div>
            <div class="top-bar-nav">
                <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="tools.html"><i class="fas fa-cubes"></i> الأدوات</a>
                <a href="templates.html"><i class="fas fa-layer-group"></i> القوالب</a>

        <span class="top-bar-title" id="templateNameBar">
            <i class="fas fa-pen-ruler"></i> محرر القوالب البصري

    <!-- EDIT INDICATOR -->
    <div class="edit-indicator" id="editIndicator">
        <i class="fas fa-mouse-pointer"></i> وضع التعديل: اضغط على أي نص لتعديله
    </div>

    <!-- SIDEBAR TOGGLE (mobile) -->
    <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-sliders"></i></button>

    <!-- MAIN LAYOUT -->
    <div class="editor-main">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sb-section">
                <h4><i class="fas fa-layer-group"></i> اختر القالب</h4>
                <select class="sb-select" id="templatePicker">
                    <option value="">— اختر قالب —</option>
                </select>
            </div>
            <div class="sb-section" id="pagesSection" style="display:none">

                    <option value="">— الخط الافتراضي —</option>

                    <option value="Noto Kufi Arabic">Noto Kufi Arabic</option>

                <button class="sb-btn reset" onclick="resetAll()"><i class="fas fa-rotate-left"></i> إعادة تعيين</button>

        </aside>

        <!-- PREVIEW AREA -->
        <div class="preview-area">
            <div class="toolbar" id="toolbar">
                <div class="device-btns">
                    <button class="device-btn active" onclick="setDevice('desktop',this)"><i class="fas fa-desktop"></i></button>
                    <button class="device-btn" onclick="setDevice('tablet',this)"><i class="fas fa-tablet-screen-button"></i></button>
                    <button class="device-btn" onclick="setDevice('mobile',this)"><i class="fas fa-mobile-screen"></i></button>
                </div>
            </div>
            <div class="preview-container">
                <div class="preview-frame" id="previewFrame">
                    <!-- EMPTY STATE -->
                    <div class="empty-state" id="emptyState">
                        <i class="fas fa-pen-ruler"></i>
                        <h2>محرر القوالب البصري</h2>
                        <p>اختر قالب من القائمة الجانبية لبدء التعديل المباشر.</p>
                    </div>
                    <!-- IFRAME (hidden until template loaded) -->
                    <iframe id="previewIframe" style="display:none"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="editor-toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="templates-data.js"></script>
    <script>
    /* =============================================
       VISUAL TEMPLATE EDITOR ENGINE v2
       ============================================= */
    let tpl = null, pageIdx = 0, editing = false;
    let mods = {}, originals = {};

    const picker = document.getElementById('templatePicker');
    const iframe = document.getElementById('previewIframe');
    const emptyState = document.getElementById('emptyState');
    const frame = document.getElementById('previewFrame');
    const nameBar = document.getElementById('templateNameBar');
    const pageTabs = document.getElementById('pageTabs');
    const indicator = document.getElementById('editIndicator');

    // Fill picker
    NOVATRIX_TEMPLATES.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id; o.textContent = t.title;
        picker.appendChild(o);
    });

    // URL param
    const pre = new URLSearchParams(location.search).get('tpl');
    if (pre) { picker.value = pre; loadTpl(pre); }
    picker.onchange = () => { if (picker.value) loadTpl(picker.value); };

    // Sidebar toggle
    document.getElementById('sidebarToggle').onclick = () => document.getElementById('sidebar').classList.toggle('hidden');

    async function loadTpl(id) {
        tpl = NOVATRIX_TEMPLATES.find(x => x.id === id);
        if (!tpl) return;
        pageIdx = 0; editing = false; mods = {}; originals = {};

        // Show sidebar sections
        ['pagesSection','editSection','colorsSection','fontsSection','actionsSection'].forEach(s =>
            document.getElementById(s).style.display = '');

        nameBar.innerHTML = `<i class="fas fa-pen-ruler"></i> ${tpl.title}`;

        // Build tabs
        pageTabs.innerHTML = '';
        (tpl.pages || []).forEach((p, i) => {
            const b = document.createElement('button');
            b.className = 'page-tab' + (i===0?' active':'');
            b.textContent = p.replace('.html','');
            b.onclick = () => goPage(i);
            pageTabs.appendChild(b);
        });

        // Read CSS colors
        try {
            const css = await (await fetch('templates/'+tpl.folderName+'/style.css')).text();
            const ex = n => { const m = css.match(new RegExp('--'+n+'\\s*:\\s*([^;]+)')); return m?m[1].trim():null; };
            const p=ex('primary'), a=ex('accent'), b=ex('bg'), t2=ex('text');
            if(p) document.getElementById('cPrimary').value=hex(p);
            if(a) document.getElementById('cAccent').value=hex(a);
            if(b) document.getElementById('cBg').value=hex(b);
            if(t2) document.getElementById('cText').value=hex(t2);
        } catch(e){}

        goPage(0);
    }

    function goPage(i) {
        if (!tpl || !tpl.pages) return;
        saveMods();
        pageIdx = i;
        const page = tpl.pages[i];
        const url = 'templates/' + tpl.folderName + '/' + page;

        pageTabs.querySelectorAll('.page-tab').forEach((t,j) => t.classList.toggle('active', j===i));

        emptyState.style.display = 'none';
        iframe.style.display = 'block';

        iframe.onload = function() {
            try {
                const doc = iframe.contentDocument;
                if (!doc) return;
                if (mods[page]) {
                    // Re-apply saved modifications to body
                    doc.body.innerHTML = mods[page];
                } else {
                    originals[page] = doc.body.innerHTML;
                }
                if (editing) enableEdit();
                applyColors();
                applyFont();
            } catch(e) { console.error(e); }
        };

        iframe.src = url;
    }

    function saveMods() {
        if (!tpl) return;
        try {
            const doc = iframe.contentDocument;
            if (doc && doc.body) {
                mods[tpl.pages[pageIdx]] = doc.body.innerHTML;
            }
        } catch(e) {}
    }

    /* EDIT MODE */
    function toggleEdit() {
        editing = !editing;
        const btn = document.getElementById('editBtn');
        if (editing) {
            btn.innerHTML = '<i class="fas fa-check"></i> إيقاف التعديل';
            btn.classList.add('active');
            indicator.classList.add('show');
            enableEdit();
            toast('وضع التعديل مفعّل — اضغط على أي نص');
        } else {
            btn.innerHTML = '<i class="fas fa-mouse-pointer"></i> تفعيل وضع التعديل';
            btn.classList.remove('active');
            indicator.classList.remove('show');
            disableEdit();
            saveMods();
            toast('تم حفظ التعديلات');
        }
    }

    function enableEdit() {
        try {
            const doc = iframe.contentDocument;
            if (!doc) return;
            doc.querySelectorAll('h1,h2,h3,h4,h5,h6,p,span,a,li,label,button,td,th').forEach(el => {
                if (el.querySelector('h1,h2,h3,h4,h5,h6,div,section,nav,footer,header,main,ul,ol')) return;
                el.contentEditable = 'true';
                el.style.cursor = 'text';
                el.addEventListener('focus', function(){ this.style.outline='2px dashed #3b82f6'; this.style.outlineOffset='2px'; });
                el.addEventListener('blur', function(){ this.style.outline='none'; });
            });
            if (!doc.getElementById('_nv_edit_css')) {
                const s = doc.createElement('style');
                s.id = '_nv_edit_css';
                s.textContent = '[contenteditable]:hover{outline:1px dashed rgba(59,130,246,0.4)!important;outline-offset:2px!important}';
                doc.head.appendChild(s);
            }
        } catch(e){}
    }

    function disableEdit() {
        try {
            const doc = iframe.contentDocument;
            doc.querySelectorAll('[contenteditable]').forEach(el => {
                el.removeAttribute('contenteditable');
                el.style.cursor = '';
                el.style.outline = '';
            });
            const s = doc.getElementById('_nv_edit_css');
            if (s) s.remove();
        } catch(e){}
    }

    /* COLORS */
    ['cPrimary','cAccent','cBg','cText'].forEach(id =>
        document.getElementById(id).addEventListener('input', applyColors));

    function applyColors() {
        try {
            const r = iframe.contentDocument.documentElement;
            r.style.setProperty('--primary', document.getElementById('cPrimary').value);
            r.style.setProperty('--accent', document.getElementById('cAccent').value);
            r.style.setProperty('--bg', document.getElementById('cBg').value);
            r.style.setProperty('--text', document.getElementById('cText').value);
        } catch(e){}
    }

    /* FONT */
    document.getElementById('fontPicker').onchange = applyFont;
    function applyFont() {
        try {
            const f = document.getElementById('fontPicker').value;
            if (!f) return;
            const doc = iframe.contentDocument;
            let link = doc.getElementById('_nv_font');
            if (!link) {
                link = doc.createElement('link');
                link.id = '_nv_font';
                link.rel = 'stylesheet';
                doc.head.appendChild(link);
            }
            link.href = `https://fonts.googleapis.com/css2?family=${f.replace(/ /g,'+')}:wght@400;600;700;800;900&display=swap`;
            doc.body.style.fontFamily = `'${f}', sans-serif`;
        } catch(e){}
    }

    /* DEVICE */
    function setDevice(d, btn) {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        frame.classList.remove('tablet-mode','mobile-mode');
        if (d==='tablet') frame.classList.add('tablet-mode');
        if (d==='mobile') frame.classList.add('mobile-mode');
    }

    /* DOWNLOAD ZIP */
    async function downloadZip() {
        if (!tpl) return;
        saveMods();
        toast('جاري تجهيز ZIP...');
        try {
            const zip = new JSZip();
            const folder = zip.folder(tpl.folderName);
            const base = 'templates/' + tpl.folderName + '/';

            // CSS
            let css = await (await fetch(base+'style.css')).text();
            const cm = {primary:document.getElementById('cPrimary').value,accent:document.getElementById('cAccent').value,bg:document.getElementById('cBg').value,text:document.getElementById('cText').value};
            for (const [k,v] of Object.entries(cm)) css = css.replace(new RegExp('--'+k+'\\s*:\\s*[^;]+'),'--'+k+':'+v);
            const font = document.getElementById('fontPicker').value;
            if (font) css = css.replace(/font-family\s*:\s*'Cairo'/g, `font-family:'${font}'`);
            folder.file('style.css', css);

            // Pages
            for (const page of tpl.pages) {
                let html;
                if (mods[page]) {
                    // Fetch original to get the head, replace body
                    const orig = await (await fetch(base+page)).text();
                    const headMatch = orig.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
                    const head = headMatch ? headMatch[0] : '';
                    html = `<!DOCTYPE html><html lang="ar" dir="rtl">${head}<body>${mods[page]}</body></html>`;
                } else {
                    html = await (await fetch(base+page)).text();
                }
                if (font) html = html.replace(/family=Cairo/g, `family=${font.replace(/ /g,'+')}`);
                folder.file(page, html);
            }

            folder.file('README.txt', `=== ${tpl.title} ===\nتم تخصيصه عبر محرر Novatrix EG البصري\nhttps://dezeleinshams-create.github.io/NEXURAEG/\n\n1. افتح index.html في المتصفح\n2. عدّل الملفات بأي محرر نصوص\n3. ارفع على Netlify أو Vercel أو GitHub Pages\n\n© 2026 Novatrix EG`);

            const blob = await zip.generateAsync({type:'blob'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = tpl.folderName+'-custom.zip';
            a.click();
            URL.revokeObjectURL(a.href);
            toast('تم تنزيل القالب بنجاح!');
        } catch(e) {
            console.error(e);
            toast('خطأ في التنزيل');
        }
    }

    /* RESET */
    function resetAll() {
        if (!tpl) return;
        mods = {};
        goPage(pageIdx);
        toast('تم إعادة التعيين');
    }

    /* HELPERS */
    function toast(msg) {
        document.getElementById('toastMsg').textContent = msg;
        document.getElementById('toast').classList.add('show');
        setTimeout(() => document.getElementById('toast').classList.remove('show'), 2500);
    }
    function hex(c) {
        if (c.startsWith('#')) return c.length===4 ? '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c;
        const m = c.match(/\d+/g);
        if (m && m.length>=3) return '#'+m.slice(0,3).map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');
        const cv = document.createElement('canvas'); cv.width=cv.height=1;
        const ctx = cv.getContext('2d'); ctx.fillStyle=c; ctx.fillRect(0,0,1,1);
        const [r,g,b] = ctx.getImageData(0,0,1,1).data;
        return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
    </script>
</body>
