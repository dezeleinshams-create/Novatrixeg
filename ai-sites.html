        const CATS = {"writing": {"label": "الكتابة والنصوص", "icon": "fas fa-pen-fancy", "color": "#3b82f6"}, "image": {"label": "توليد وتحرير الصور", "icon": "fas fa-image", "color": "#8b5cf6"}, "video": {"label": "الفيديو والأنيميشن", "icon": "fas fa-film", "color": "#ef4444"}, "audio": {"label": "الصوت والموسيقى", "icon": "fas fa-headphones", "color": "#f59e0b"}, "social": {"label": "السوشيال ميديا", "icon": "fas fa-share-nodes", "color": "#ec4899"}, "seo": {"label": "السيو والتسويق", "icon": "fas fa-chart-line", "color": "#10b981"}, "design": {"label": "التصميم والجرافيك", "icon": "fas fa-palette", "color": "#6366f1"}, "productivity": {"label": "الإنتاجية والأتمتة", "icon": "fas fa-bolt-lightning", "color": "#0ea5e9"}, "coding": {"label": "البرمجة والتطوير", "icon": "fas fa-code", "color": "#a855f7"}};

        const grid = document.getElementById("aiGrid");
        const counter = document.getElementById("aiCount");
        const searchInput = document.getElementById("aiSearch");
        const catsRow = document.getElementById("aiCatsRow");

        // Build category chips
        Object.keys(CATS).forEach(key => {
            const c = CATS[key];
            const btn = document.createElement("button");
            btn.className = "ai-cat-chip";
            btn.setAttribute("data-cat", key);
            btn.innerHTML = `<i class="${c.icon}"></i> ${c.label}`;
            catsRow.appendChild(btn);
        });

        let activeCat = "all";

        catsRow.addEventListener("click", e => {
            const chip = e.target.closest(".ai-cat-chip");
            if (!chip) return;
            catsRow.querySelectorAll(".ai-cat-chip").forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            activeCat = chip.getAttribute("data-cat");
            render();
        });

        searchInput.addEventListener("input", render);

        function render() {
            const q = searchInput.value.trim().toLowerCase();
            const filtered = SITES.filter(s => {
                const matchCat = activeCat === "all" || s.cat === activeCat;
                const matchQ = !q || s.name.toLowerCase().includes(q) || s.desc.includes(q);
                return matchCat && matchQ;
            });

            grid.innerHTML = "";
            filtered.forEach(s => {
                const catInfo = CATS[s.cat] || { label: s.cat, color: "#64748b" };
                const card = document.createElement("a");
                card.href = s.url;
                card.target = "_blank";
                card.rel = "noopener noreferrer";
                card.className = "ai-card";
                card.innerHTML = `
                    <div class="ai-card-top">
                        <div class="ai-card-icon" style="background:${catInfo.color}22;color:${catInfo.color};"><i class="${s.icon}"></i></div>
                        <div>
                            <div class="ai-card-name">${s.name}</div>
                            <div class="ai-card-cat">${catInfo.label}</div>
                        </div>
                    </div>
                    <div class="ai-card-desc">${s.desc}</div>
                    <div class="ai-card-link"><i class="fas fa-arrow-up-right-from-square"></i> زيارة الموقع</div>
                `;
                grid.appendChild(card);
            });

            counter.textContent = filtered.length;

            // Award points on first visit
            if (window.ViralEngine && !sessionStorage.getItem("ai_sites_visited")) {
                sessionStorage.setItem("ai_sites_visited", "1");
                window.ViralEngine.addPoints(5, "تصفح دليل مواقع AI");
            }
        }

        render();

        // Theme toggle
        const themeBtn = document.getElementById("themeToggleBtn");
        if (themeBtn) {
            themeBtn.addEventListener("click", () => {
                document.body.classList.toggle("light-theme");
                const isLight = document.body.classList.contains("light-theme");
                themeBtn.querySelector("i").className = isLight ? "fas fa-moon" : "fas fa-sun";
            });
        }
    })();
    </script>
